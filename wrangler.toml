name = "roof-claim-decoder"
main = "worker/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "roof-claim-decoder"
database_id = "469869a2-d011-46d3-808e-879bdc0aa038"

[[r2_buckets]]
binding = "CLAIM_BUCKET"
bucket_name = "roof-claim-decoder-fallback"

# Hourly cleanup of expired fallback PDFs (backstop is the R2 lifecycle rule).
[triggers]
crons = ["0 * * * *"]

[vars]
# Public site key is safe to expose; wire it into public/index.html if/when
# you turn on Turnstile.
TURNSTILE_SITE_KEY = "REPLACE_WITH_YOUR_SITE_KEY"

# Secrets (do NOT put these here) — set via Cloudflare dashboard:
#   Workers & Pages > roof-quote-decoder > Settings > Variables and Secrets
#     TURNSTILE_SECRET_KEY   (Secret)
#     STAFF_KEY              (Secret)
#     RESEND_API_KEY         (Secret)  — from resend.com, enables lead-notification emails
#
# Deliberately left OUT of this file (set as dashboard Variables instead, not
# Secrets — they're not sensitive, just easy to change without a code push):
#     ADMIN_EMAIL  — who gets notified of each new lead. This is the "control"
#                    switch: change this in the dashboard any time, no redeploy.
#     NOTIFY_FROM  — optional; defaults to onboarding@resend.dev if unset.
#
# If a var name appears in [vars] below, Cloudflare Workers Builds will
# enforce that value on every deploy and overwrite anything set in the
# dashboard for that name — which is why ADMIN_EMAIL/NOTIFY_FROM stay out of
# this file entirely.
